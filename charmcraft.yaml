# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
name: pihole
type: charm
title: Pi-hole
summary: Network-wide DNS sinkhole and ad blocker for Ubuntu machines.
description: |
  Pi-hole is a DNS sinkhole. It answers DNS for a whole network and refuses to
  resolve the domains that serve advertisements and trackers, so every device
  behind it is filtered without installing anything on the device itself.

  This charm deploys and operates Pi-hole v6 on Ubuntu machines — LXD, MAAS, or
  a public cloud — using the `pihole-by-rajannpatel` snap. It provides one
  optional relation, `cos-agent`: relate it to `opentelemetry-collector` and
  the subordinate takes the snap's logs (through its read-only `logs` content
  slot) and host metrics, forwarding them to your observability backends.

  What the charm does for you:

  - Installs the snap at a revision the charm's release defines, held
    against auto-refresh — the snap never updates itself — and starts the
    FTL daemon, which the snap does not start by itself. The admin UI
    serves on 80 and 443, the latter with a self-signed certificate.
  - Takes port 53 away from `systemd-resolved` on deployment, and gives
    it back on removal, so the machine is never left without a resolver.
  - Closes the NTP server the snap opens on 123/udp by default.
  - Generates the admin UI password itself, stores it in a Juju secret,
    and applies it before the daemon ever serves; actions retrieve and
    rotate it. There is no configuration option for the password.
  - Reports health from the Pi-hole API, not from the service manager,
    so `active` means "answering queries" — and runs the snap's own
    `snap-check` diagnostic when collecting status on an installed
    unit, so a port conflict or a broken config shows up as `blocked`
    naming the remedy.
  - Connects the snap's diagnostic plugs (`system-observe`,
    `hardware-observe`, `mount-observe`, `time-control`,
    `process-control`), keeping FTL's log free of capability warnings.
  - Gives the operator escape hatches as actions: `snap-check` (run the
    diagnostic on demand), `update-gravity` (refresh blocklists now,
    optionally a full rebuild), and `free-port-53` (recover the port).
  - Optionally sets the blocklist refresh schedule (`gravity-schedule`,
    a systemd `OnCalendar` string) through a host drop-in, because the
    snap cannot manage its own timer.

  A single unit is the supported shape. Two Pi-holes are two independent
  resolvers with independently drifting blocklists, not a cluster.

  Note that the underlying snap is **unofficial**: the Pi-hole project does not
  support snap-based installations. See this charm's documentation before
  deploying it anywhere you care about.

links:
  documentation: https://github.com/Abuelodelanada/pi-hole-operator/tree/main/docs
  issues: https://github.com/Abuelodelanada/pi-hole-operator/issues
  source: https://github.com/Abuelodelanada/pi-hole-operator
  website: https://github.com/Abuelodelanada/pi-hole-operator

# Documentation:
# https://documentation.ubuntu.com/charmcraft/stable/howto/build-guides/select-platforms/
base: ubuntu@26.04
platforms:
  amd64:
  arm64:

# Support for the ubuntu@26.04 base landed in Juju 3.6.17, so anything
# older cannot deploy this charm at all. There is no "machine" feature
# to assume.
assumes:
  - juju >= 3.6.17

# The one relation: optional, so the charm reaches ActiveStatus with zero
# relations (rule 5). `limit: 1` is decided at birth because Juju enforces
# it and adding it later breaks `juju refresh` for existing deployments
# (ADR-0008 §2.3).
provides:
  cos-agent:
    interface: cos_agent
    limit: 1
    optional: true

# The one Charmhub-hosted library this repo consumes: the cos_agent
# provider, vendored via `charmcraft fetch-libs` into lib/charms/...,
# never edited, never linted. No PyPI replacement exists (ADR-0008 §2.4).
charm-libs:
  - lib: grafana_agent.cos_agent
    version: "0"

# `additionalProperties` is set explicitly on every action: the default
# differs between Juju 3 (true) and Juju 4 (false), so omitting it means
# the behaviour changes underneath you.
actions:
  get-admin-password:
    description: |
      Retrieve the Pi-hole admin UI password.

      The charm generates this password itself and stores it in a Juju
      secret; there is no configuration option for it.
    additionalProperties: false
  rotate-admin-password:
    description: |
      Generate a new admin UI password, store it, and apply it to Pi-hole.

      Takes no parameters: a password passed as an action parameter would be
      recorded in the action's params and visible via `juju show-task`.
      Rotating invalidates existing admin UI sessions.
    additionalProperties: false
  snap-check:
    description: |
      Run the snap's own diagnostic (plug connections, port conflicts,
      AppArmor denials) and return its output and exit code verbatim.
    additionalProperties: false
  update-gravity:
    description: |
      Refresh blocklists immediately instead of waiting for the weekly timer.
      A full download can take minutes on a slow line — pass ``--wait`` when
      running it.
    params:
      force:
        type: boolean
        description: Rebuild gravity.db from scratch rather than incrementally.
        default: false
    additionalProperties: false
  free-port-53:
    description: |
      Re-run the port-53 freeing procedure. This is the remedy named in the
      port-conflict BlockedStatus message. FTL's Restart=on-failure recovers
      by itself once the port is free.
    additionalProperties: false

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

config:
  options:
    upstream-dns:
      type: string
      default: ""
      description: |
        Comma-separated upstream DNS resolvers (e.g. 1.1.1.1,9.9.9.9).
        Empty means the charm does not manage upstreams.
    dns-listening-mode:
      type: string
      default: ""
      description: |
        FTL listening mode: LOCAL (loopback only), ALL (every
        interface), or NONE (no DNS). Empty means the charm does not
        manage this setting.

        FTL's SINGLE and BIND are not offered: they need an interface
        to bind to, which this charm does not manage yet.
    blocking-enabled:
      type: boolean
      default: true
      description: Whether DNS-based ad blocking is active.
    dnssec-enabled:
      type: boolean
      default: false
      description: Whether DNSSEC validation is enabled.
    ntp-server-enabled:
      type: boolean
      default: false
      description: |
        Whether the FTL NTP server on 123/udp is enabled.
        The charm default is false, diverging from the snap's default
        of true. See the README.
    gravity-schedule:
      type: string
      default: ""
      description: |
        A systemd OnCalendar expression for the weekly gravity update
        timer (e.g. 'Sun *-*-* 03:00'). Empty means the charm does not
        manage the schedule — the snap's randomised default applies.
        The charm writes a host systemd drop-in because the snap's
        configure hook rejects all timer keys.
