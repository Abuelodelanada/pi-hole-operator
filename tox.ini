[tox]
no_package = True
skip_missing_interpreters = True
min_version = 4.0.0
# tox-uv provides the uv-venv-lock-runner used below; provision it rather than
# expecting every contributor to have installed it globally.
requires =
    tox-uv>=1.11
env_list = fmt, lint, static, unit

[vars]
src_path = {tox_root}/src
tests_path = {tox_root}/tests
all_path = {[vars]src_path} {[vars]tests_path}

[testenv]
runner = uv-venv-lock-runner
base_python = py314
set_env =
    PYTHONPATH = {tox_root}/lib:{[vars]src_path}
    PYTHONBREAKPOINT = pdb.set_trace
    PY_COLORS = 1
pass_env =
    PYTHONPATH
    CHARM_PATH
    JUJU_*

[testenv:fmt]
description = Apply coding style standards
dependency_groups = dev
commands =
    ruff format {[vars]all_path}
    ruff check --fix {[vars]all_path}

[testenv:lint]
description = Check code against coding style standards
dependency_groups = dev
commands =
    ruff check {[vars]all_path}
    ruff format --check --diff {[vars]all_path}

[testenv:static]
description = Run static type checks
dependency_groups = dev
commands = pyright {posargs}

[testenv:unit]
description = Run unit tests
dependency_groups = dev
commands =
    coverage run --module pytest --tb native {[vars]tests_path}/unit {posargs}
    coverage report

[testenv:integration]
description = Run integration tests against a Juju machine model
dependency_groups = dev
pass_env =
    # The integration tests never pack the charm. Pack once by hand and point
    # CHARM_PATH at the result.
    CHARM_PATH
    JUJU_*
commands = pytest --exitfirst --tb native --log-cli-level=INFO {[vars]tests_path}/integration {posargs}

[testenv:lock]
description = Update uv.lock
# Not the lock runner: that syncs from the lock file first, which is precisely
# what is stale when you need this environment.
skip_install = true
runner = virtualenv
allowlist_externals = uv
commands = uv lock --upgrade

[testenv:flaplint]
description = Detect relation-databag ordering churn (advisory, not in env_list)
skip_install = true
runner = virtualenv
allowlist_externals = uvx
commands =
    uvx --python 3.12 --from git+https://github.com/michaeldmitry/flaplint@v1.1.0 \
        flaplint {[vars]src_path} --own-only --min-confidence high
